# User Info
RAYOS_USERNAME#$USER#Username
RAYOS_HOSTNAME#RayOS#Hostname
RAYOS_EMAIL##E-Mail
RAYOS_SECRET_PASSWORD##Password

# GitHub
RAYOS_GITHUB_USERNAME#$RAYOS_USERNAME#GitHub Username
RAYOS_GITHUB_EMAIL#$RAYOS_EMAIL#GitHub E-Mail

# Hardware Config
RAYOS_DISK#$(findmnt -n -o SOURCE /mnt)#Disk Path
RAYOS_NETWORK_INTERFACE#$(ip -o link show | awk -F': ' '/state UP/ {print $2}')#Network Interface
RAYOS_DUAL_BOOT#false#Dual-boot

# Local
RAYOS_TIMEZONE#$(timedatectl show --property=Timezone --value)#Timezone
RAYOS_KEYBOARD_LAYOUT#$(localectl status | grep 'X11 Layout' | awk '{print $3}')#Keyboard Layout
RAYOS_LANGUAGE#$(locale | grep '^LANG=' | cut -d= -f2)#Language
